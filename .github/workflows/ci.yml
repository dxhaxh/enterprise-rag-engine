name: Enterprise RAG CI Pipeline

# 1. When should this run? Every time code is pushed to the main branch!
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # 2. What kind of server should GitHub spin up?
    runs-on: ubuntu-latest

    steps:
    # 3. Pull our code into the cloud server
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 4. Install Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 5. Install our required libraries
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 6. Run the unit tests!
    - name: Run Pytest Suite
      run: |
        pytest tests/