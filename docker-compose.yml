version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333" 
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis/redis-stack:latest
    container_name: rag_redis
    ports:
      - "6379:6379" 
      - "8001:8001" 
    volumes:
      - redis_data:/data

volumes:
  qdrant_data:
  redis_data: